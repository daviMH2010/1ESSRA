<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Rock in Rio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h2>Cadastro de Usuário</h2>

    <div class="campo-container">
        <label for="campoNome">Nome Completo:</label>
        <input type="text" id="campoNome" placeholder="Digite seu nome">
    </div>

    <div class="campo-container">
        <label for="campoCpf">CPF:</label>
        <input type="text" id="campoCpf" placeholder="000.000.000-00" maxlength="14">
    </div>

    <div class="campo-container">
        <label for="campoEmail">E-mail:</label>
        <input type="email" id="campoEmail" placeholder="seuemail@exemplo.com">
    </div>

    <div class="campo-container">
        <label for="campoData">Data de Nascimento:</label>
        <input type="date" id="campoData">
    </div>

    <div class="campo-container">
        <label for="campoSenha">Senha:</label>
        <input type="password" id="campoSenha" placeholder="Digite sua senha">
    </div>

    <button id="btnCadastrar">Cadastrar</button>

    <div id="painelResultado"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
